name: Frontend CI

# backend-ci.yml과 동일한 구조로 작성되어 있다.
# main 브랜치에 push 또는 pull_request 이벤트가 발생했을 때,
# frontend 디렉토리 또는 워크플로우 파일이 변경되면 실행되도록 설정되어 있다
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

# 동기화 구성도 마찬가지로 되어 있고.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# job 구성도 동일하다. 여기도 단일 job 구성
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # 여기도 단일 step 구성이다.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # build 스크립트 안에 tsc --noEmit(typecheck)가 이미 포함돼 있음
      - run: pnpm build
      
      # argoCD 기반 CD 파이프라인 시작
      - name: Docker Hub 로그인
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx 설정
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 및 도커 허브 푸시
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/my-frontend:latest

      - name: K8s 매니페스트 이미지 태그 업데이트 및 Git Commit/Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: . # k8s 디렉터리 접근을 위해 저장소 루트로 작업 경로 변경
        run: |
          # 1. k8s/frontend.yaml 내 이미지 태그를 새로 빌드된 커밋 SHA로 교체
          sed -i 's|image: .*my-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/my-frontend:${{ github.sha }}|g' k8s/frontend.yaml
          
          # 2. 변경된 매니페스트를 main 브랜치에 커밋 및 푸시 (ArgoCD가 이를 감지함)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/frontend.yaml
          git commit -m "chore(cd): update frontend image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push